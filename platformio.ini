[platformio]
extra_configs = 
  factory_settings.ini
  features.ini
;default_envs = esp12e
default_envs = node32s
;default_envs = esp01_1m

[env]
build_flags=
  ${factory_settings.build_flags}
  ${features.build_flags}
  -D NO_GLOBAL_ARDUINOOTA
  ; Uncomment PROGMEM_WWW to enable the storage of the WWW data in PROGMEM
  -D PROGMEM_WWW
  ; Uncomment to configure Cross-Origin Resource Sharing
  -D ENABLE_CORS
  -D CORS_ORIGIN=\"*\"
  ; Master Device, this will render UI for remote devices if enabled
  -D REMOTE_CONFIG_ENABLED=true
  -D MASTER_DEVICE=\"192.168.0.172\"
  -D BUILD_VERSION=\"1.3.0\"
  -D AUTO_SYSTEM_REBOOT_ENABLED=true

  ; Uncomment to add MAC address to mqtt device names
  ;-D MQTT_FRIENDLY_NAME 

  ; Uncomment to target Sinilink onboard relay on PIN 4 and CHANNEL_TWO must be anabled
  ;-D SINILINK

  ; Uncomment if LILYGO 4 relay board
  ;-D LILYGO

  ; Uncomment if SONOFF relay board select esp01_1m
  ;-D SONOFF

  ; Uncomment if ESP01_M relay board select esp01_1m
  ;-D ESP01_M

  ; Uncomment to enable channel on the UI
  -D CHANNEL_ONE
  -D CHANNEL_TWO
  -D CHANNEL_THREE
  -D CHANNEL_FOUR
  
  ; ESP32 specific watchdog and stability settings
  -D CONFIG_ESP32_PANIC_HANDLER_TIMEOUT=10
  -D CONFIG_ESP_TASK_WDT_TIMEOUT_S=60
  -D CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0=0
  -D CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU1=0
  
  ; ESP32 dual-core and FreeRTOS stability fixes
  -D CONFIG_FREERTOS_UNICORE=0
  -D CONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ=240
  -D CONFIG_SPIRAM_SUPPORT=0
  -D CONFIG_ESP32_ENABLE_STACK_OVERFLOW_GUARDS=1
  -D CONFIG_ESP_TASK_WDT_EN=1
  -D CONFIG_ESP_TASK_WDT_INIT=1
  -D CONFIG_ESP_INT_WDT=1
  -D CONFIG_ESP_INT_WDT_TIMEOUT_MS=300
  -D CONFIG_ESP32_PANIC_PRINT_HALT=1
  -D CONFIG_ESP_SYSTEM_PANIC_PRINT_HALT=1
  
  ; ESP32 flash memory and core dump fixes
  -D CONFIG_ESP32_ENABLE_COREDUMP_TO_NONE=1
  -D CONFIG_ESP32_CORE_DUMP_MAX_TASKS_NUM=0
  -D CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=1
  -D CONFIG_ESP_COREDUMP_MAX_TASKS_NUM=0
  -D CONFIG_ESPTOOLPY_FLASHSIZE_4MB=1
  -D CONFIG_PARTITION_TABLE_SINGLE_APP=1

; ensure transitive dependencies are included for correct platforms only
lib_compat_mode = strict

; Uncomment & modify the lines below in order to configure OTA updates
;upload_flags = 
;  --port=8266 
;  --auth=esp-react
;upload_port = 192.168.0.136
;upload_protocol = espota

framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_type = debug

extra_scripts = 
 pre:scripts/build_interface.py

lib_deps =
  ArduinoJson@>=6.0.0,<7.0.0
  ESP32Async/ESPAsyncWebServer
  AsyncMqttClient@>=0.9.0,<1.0.0

  
[env:esp12e]
platform = espressif8266
board = esp12e
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
; ESP8266 optimization flags to reduce flash usage
build_flags = 
  ${env.build_flags}
  -Os                         ; Optimize for size
  -ffunction-sections         ; Place functions in separate sections
  -fdata-sections             ; Place data in separate sections
  -Wl,--gc-sections          ; Enable garbage collection of unused sections
  -DNDEBUG                   ; Disable debug assertions
  ; Disable extra channels for ESP8266 to save flash space
  -UCHANNEL_THREE             ; Undefine CHANNEL_THREE
  -UCHANNEL_FOUR              ; Undefine CHANNEL_FOUR
build_type = release          ; Use release build instead of debug

[env:node32s]
; Use min_spiffs partitions (larger app space) with LittleFS filesystem
board_build.partitions = min_spiffs.csv
platform = espressif32

;platform = https://github.com/platformio/platform-espressif32.git#feature/arduino-upstream
;platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.17

board = node32s
board_build.filesystem = littlefs
board_build.flash_mode = qio  ; Set the flash mode to DIO
[env:esp01_1m]
platform = espressif8266
board = esp01_1m
board_build.flash_mode = dout